# ビルドスクリプト（postinstall 等）の実行を許可する依存の一覧。
# `.npmrc` の `ignore-scripts=true` により既定では全依存の install スクリプトが
# 無視されるため、ネイティブバイナリ配置等で build が要るものだけをここで許可する。
# この一覧に無い依存の build が無視されると pnpm 10+ は
# `ERR_PNPM_IGNORED_BUILDS` で異常終了する（CI のクリーンインストールで顕在化）。
# pnpm のバージョン差でどちらのキーが読まれても効くよう両形式で列挙する。
allowBuilds:
  "@firebase/util": true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
# 自前パッケージは公開直後に取り込むため minimumReleaseAge の隔離対象から除外する。
minimumReleaseAgeExclude:
  - "@bpim/bpicalc"
onlyBuiltDependencies:
  - "@firebase/util"
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
# 間接依存の脆弱性対策（Dependabot）。親が古い範囲を固定していて `pnpm update` では上がらないものだけ、
# 修正済みの最低バージョンへ引き上げる。親側が追従したら外してよい。
overrides:
  "vite@>=8.0.0 <8.1.6": "^8.1.6"
  "brace-expansion@>=3.0.0 <5.0.12": "^5.0.12"
  "picomatch@>=4.0.0 <4.0.4": "^4.0.4"
  "browserslist@<4.28.7": "^4.28.7"
  "baseline-browser-mapping@<2.11.0": "^2.11.0"
  "@grpc/grpc-js@<1.13.6": "^1.13.6"
  "fflate@>=0.7.0 <0.7.5": "^0.7.5"
  "postcss-selector-parser@<6.1.5": "^6.1.5"
